<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/calculator.css" />
    <title>Calculator</title>
    <script src="js/calculator.js" defer></script>
  </head>
  <body>
    <div class="calculator">
      <div class="calculator-display"></div>

      <div class="calculator-button-container">
        <div class="calculator-number-buttons">
          <button class="btn nmbr-btn btn-one">1</button>
          <button class="btn nmbr-btn btn-two">2</button>
          <button class="btn nmbr-btn btn-three">3</button>
          <button class="btn nmbr-btn btn-four">4</button>
          <button class="btn nmbr-btn btn-five">5</button>
          <button class="btn nmbr-btn btn-six">6</button>
          <button class="btn nmbr-btn btn-seven">7</button>
          <button class="btn nmbr-btn btn-eight">8</button>
          <button class="btn nmbr-btn btn-nine">9</button>
          <button class="btn nmbr-btn btn-zero">0</button>
          <button class="btn nmbr-btn btn-dot">.</button>
        </div>
        <div class="calculator-operator-buttons">
          <button class="btn btn-back">⌫</button>
          <button class="btn btn-clear">C</button>
          <button class="btn operator-btn btn-multiply">*</button>
          <button class="btn operator-btn btn-divide">/</button>
          <button class="btn operator-btn btn-subtract">-</button>
          <button class="btn operator-btn btn-add">+</button>
          <button class="btn btn-equals">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
